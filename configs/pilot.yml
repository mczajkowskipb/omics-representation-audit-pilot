protocol:
  name: SONATA BIS PILOT PROTOCOL
  version: "1.0"
  sha256: 5104901b66403ab29bbad24f7fdc48dda10121b1a584740ec47af02790d6a704

runtime:
  python_min: "3.11"
  deterministic_cpu: true
  threads_per_job: 1
  forbidden_project_dependencies:
    - torch
    - tensorflow
    - cupy
    - jax
    - cuda
    - fuzzy
    - deap

preprocessing:
  feature_budget: 200
  feature_budget_sensitivity: 500
  feature_score: median_absolute_deviation
  feature_tie_break: feature_id
  imputation: source_median
  scaling: source_median_iqr
  quantile_method: linear
  zero_iqr_fallback: 1.0

relations:
  rank_method: average
  margins: [0.00, 0.02]
  sensitivity_margin: 0.05
  missing_policy: explicit_mask
  primary_relation_budget: 2000
  sensitivity_relation_budgets: [500, 5000]
  coverage_strictly_above: 0.90
  normalized_entropy_at_least: 0.05
  perturbation_stability_at_least: 0.80

hybrid:
  alphas: [0.25, 0.50, 0.75]
  scale: source_median_nonzero_upper_triangle

clustering:
  engine: deterministic_pam_build_swap
  tie_break: stable_sample_id
  improvement_tolerance: 1.0e-12

audit:
  quality: min_prediction_strength_cluster_stability_perturbation_invariance
  primary_resamples: 20
  smoke_resamples: 5
  min_cluster_fraction: 0.10

selector:
  null_quantile: 0.90
  null_quantile_method: higher
  multiple_testing_calibration: cross_fitted_max_method_excess
  minimum_hybrid_gain: 0.02
  equivalence_margin: 0.02
  uncertain_below_frequency: 0.60
